<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jelajahi Bidang dan Course | ArahKarya</title>
  <meta name="description" content="Katalog enam bidang dengan pencarian, filter, dan simulasi tugas singkat.">
  <meta name="theme-color" content="#102B5C">
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <script>try{if(JSON.parse(localStorage.getItem('arahkarya_theme'))==='dark')document.documentElement.setAttribute('data-bs-theme','dark');}catch(e){}</script>
</head>
<body data-page="jelajahi">
<div id="site-nav"></div>
<main id="main" tabindex="-1">

<div class="container ak-page-head">
  <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Beranda</a></li><li class="breadcrumb-item active" aria-current="page">Jelajahi Bidang</li></ol></nav>
  <h1 class="h2 mb-2">Jelajahi Bidang & Course</h1>
  <p class="ak-lead mb-0">Pilih bidang, coba simulasi tugas singkat, atau lihat jalur kariernya.</p>
</div>
<div class="container pb-4">
  <div class="ak-card-gold p-3 p-lg-4 mb-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div><strong>Belum tahu mulai dari mana?</strong> <span class="text-muted">Ikuti tes minat dan bakat 8 menit.</span></div>
    <a class="btn btn-primary" href="tes-minat.html">Ikuti Tes Minat</a>
  </div>
  <form class="ak-card p-3 p-lg-4 mb-3" id="filter-form" role="search" aria-label="Cari dan filter bidang">
    <div class="row g-3">
      <div class="col-lg-4"><label for="f-q" class="form-label">Cari bidang atau keterampilan</label><input type="search" class="form-control" id="f-q" placeholder="mis. desain, data, HTML" autocomplete="off"></div>
      <div class="col-6 col-lg-2"><label for="f-jenjang" class="form-label">Jenjang</label><select class="form-select" id="f-jenjang"><option value="">Semua</option><option>SMA/SMK</option><option>Mahasiswa</option><option>Umum</option></select></div>
      <div class="col-6 col-lg-2"><label for="f-level" class="form-label">Kesulitan</label><select class="form-select" id="f-level"><option value="">Semua</option><option>Pemula</option><option>Menengah</option></select></div>
      <div class="col-6 col-lg-2"><label for="f-dur" class="form-label">Durasi</label><select class="form-select" id="f-dur"><option value="">Semua</option><option value="short">10 menit atau kurang</option><option value="mid">11 sampai 12 menit</option><option value="long">Lebih dari 12 menit</option></select></div>
      <div class="col-6 col-lg-2"><label for="f-sort" class="form-label">Urutkan</label><select class="form-select" id="f-sort"><option value="name">Nama (A-Z)</option><option value="dur-asc">Durasi tersingkat</option><option value="dur-desc">Durasi terlama</option><option value="level">Kesulitan (pemula dulu)</option></select></div>
    </div>
  </form>
  <div class="d-flex justify-content-between align-items-center mb-3"><p class="mb-0 text-muted" id="f-count" aria-live="polite"></p><button class="btn btn-sm btn-outline-primary" type="button" id="f-reset">Atur ulang filter</button></div>
  <div class="row g-3" id="field-grid"></div>
  <div id="field-empty" class="ak-empty" hidden><i class="bi bi-search ak-empty-icon" aria-hidden="true"></i><h2 class="h5 mt-3">Tidak ada bidang yang cocok</h2><p class="text-muted">Coba kata kunci lain atau longgarkan filter.</p><button class="btn btn-primary" type="button" id="f-reset2">Atur ulang filter</button></div>
</div>

</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/navigation.js"></script>
<script src="js/explore.js"></script>
</body>
</html>
